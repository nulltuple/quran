# Arabican letter inventory: pedagogical facts only. Unicode facts (joining, forms) live in the
# ArabicScript Swift module; LearningContentTests checks that both list the same letters in the
# same order and agree on which letters join. Order is the traditional hija'i teaching order.
#
# name: the letter's English-transliterated name. sound: the consonant it writes (alif writes no
# consonant of its own; it lengthens fatha). family: letters sharing one written skeleton.

[[letter]]
char = "ا"
name = "alif"
sound = "ā"
family = "alif"
joins_next = false

