# Recitation bundled for the Quran bridge (milestone L5): Mishary Rashid al-Afasy, surah by surah, the
# recording QUL recitation 411 times word by word. The timings come from the Quran app's bundled
# Example/QuranEngineApp/Resources/qul_afasy.db (Tools/build-qul-word-data.py), which was measured on
# exactly these files; compile.py checks each file's SHA-256 so a different recording is rejected.
# Files are the downloads, byte for byte (MP3, 128 kbit/s); transcoding would shift the timings.

