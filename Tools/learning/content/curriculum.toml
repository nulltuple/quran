[[orientation]]
id = "orientation.rtl"
title = "Arabic is read right to left"

[[orientation]]
id = "orientation.letters-and-sounds"
title = "Letters write sounds; marks write vowels"

[[orientation]]
id = "orientation.joining"
title = "Letters join inside a word and change shape: initial, medial and final"

[[orientation]]
id = "orientation.non-joiners"
title = "Six letters (ا د ذ ر ز و) never join the letter after them"

[[orientation]]
id = "orientation.short-vowels"
title = "Three small marks write the short vowels: fatha, a stroke above, reads a; kasra, a stroke below, reads i; damma, a small waw above, reads u"

[[orientation]]
id = "orientation.long-vowels"
title = "A long vowel is held twice as long: alif after fatha, waw after damma and ya after kasra carry no mark of their own and stretch the vowel before them"

[[orientation]]
id = "orientation.dagger-alif"
title = "A small upright alif over a letter (the dagger alif) is a long a, like a full alif; a wavy maddah over a long vowel stretches it further"

[[orientation]]
id = "orientation.sukun"
title = "Sukun, a small round head over a letter, means the letter has no vowel: it closes the syllable before it"

[[orientation]]
id = "orientation.shadda"
title = "Shaddah, a small w-shaped mark, doubles a letter: read it once closed and once with its vowel"

[[orientation]]
id = "orientation.tanwin"
title = "Tanwin, a doubled vowel mark, adds an n sound to the end of a word; an alif written after fathatan is not read when you go on"

[[orientation]]
id = "orientation.wasl"
title = "Alif wasla (an alif with a small head) is read only when you start from it; in the middle of reading it is silent"

[[orientation]]
id = "orientation.sun-letters"
title = "The lam of al- is silent before a sun letter, which then carries a shaddah; before a moon letter the lam carries a sukun and is read"

[[orientation]]
id = "orientation.silent-circle"
title = "A small circle over an alif, waw or ya marks a letter that is written but never read"

[[orientation]]
id = "orientation.hamza-seats"
title = "Hamzah often sits on a seat (alif, waw or ya) or stands alone; the seat is not read, the hamzah is"

[[orientation]]
id = "orientation.ta-marbuta"
title = "Ta marbutah, a ha with two dots, is read as t when the reader goes on"

