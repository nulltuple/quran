# Arabican curriculum (pilot, milestone L1): units U1-U2. Each lesson lists the skills it teaches
# and the skills a learner must have before starting it. Skill ids are generated by the compiler
# from letters.toml (see Tools/learning/compile.py, `generated_skills`):
#   letter.recognize.<letter>, letter.sound.<letter>, letter.form.<letter>.<form>,
#   sound.discriminate.<a>-<b>[-<c>], orientation.<topic>.
# Lessons are authored here by agents and need a qualified teacher's review before any public
# release (spec 03 §4).

[quran]
# Suras whose words become quran_word_ref rows, verified against the canonical text.
suras = [1]

[[unit]]
id = "U1"
title = "Getting started"

[[unit]]
id = "U2"
title = "The letters"

[[orientation]]
id = "orientation.rtl"
title = "Arabic is read right to left"

[[orientation]]
id = "orientation.letters-and-sounds"
title = "Letters write sounds; marks write vowels"

[[lesson]]
id = "u1.l01"
unit = "U1"
title = "How Arabic is written"
teaches = ["orientation.rtl", "orientation.letters-and-sounds"]
requires = []

[[lesson]]
id = "u2.l01"
unit = "U2"
title = "Alif and the ba family"
teaches = ["letter.recognize.ا", "letter.recognize.ب", "letter.recognize.ت", "letter.recognize.ث",
           "letter.sound.ا", "letter.sound.ب", "letter.sound.ت", "letter.sound.ث"]
requires = ["orientation.rtl"]

[[lesson]]
id = "u2.l02"
unit = "U2"
title = "The jim family"
teaches = ["letter.recognize.ج", "letter.recognize.ح", "letter.recognize.خ",
           "letter.sound.ج", "letter.sound.ح", "letter.sound.خ"]
requires = ["letter.recognize.ب"]

[[lesson]]
id = "u2.l03"
unit = "U2"
title = "Dal, dhal, ra and zay"
teaches = ["letter.recognize.د", "letter.recognize.ذ", "letter.recognize.ر", "letter.recognize.ز",
           "letter.sound.د", "letter.sound.ذ", "letter.sound.ر", "letter.sound.ز"]
requires = ["letter.recognize.ج"]

[[lesson]]
id = "u2.l04"
unit = "U2"
title = "Sin, shin, sad and dad"
teaches = ["letter.recognize.س", "letter.recognize.ش", "letter.recognize.ص", "letter.recognize.ض",
           "letter.sound.س", "letter.sound.ش", "letter.sound.ص", "letter.sound.ض"]
requires = ["letter.recognize.د"]

[[lesson]]
id = "u2.l05"
unit = "U2"
title = "Ta, za, ayn and ghayn"
teaches = ["letter.recognize.ط", "letter.recognize.ظ", "letter.recognize.ع", "letter.recognize.غ",
           "letter.sound.ط", "letter.sound.ظ", "letter.sound.ع", "letter.sound.غ"]
requires = ["letter.recognize.س"]

[[lesson]]
id = "u2.l06"
unit = "U2"
title = "Fa, qaf, kaf and lam"
teaches = ["letter.recognize.ف", "letter.recognize.ق", "letter.recognize.ك", "letter.recognize.ل",
           "letter.sound.ف", "letter.sound.ق", "letter.sound.ك", "letter.sound.ل"]
requires = ["letter.recognize.ط"]

[[lesson]]
id = "u2.l07"
unit = "U2"
title = "Mim, nun, ha, waw, ya and hamzah"
teaches = ["letter.recognize.م", "letter.recognize.ن", "letter.recognize.ه", "letter.recognize.و",
           "letter.recognize.ي", "letter.recognize.ء",
           "letter.sound.م", "letter.sound.ن", "letter.sound.ه", "letter.sound.و",
           "letter.sound.ي", "letter.sound.ء"]
requires = ["letter.recognize.ف"]

[[lesson]]
id = "u2.l08"
unit = "U2"
title = "Sounds that are easy to mix up"
teaches = ["sound.discriminate.ح-ه", "sound.discriminate.ع-ء", "sound.discriminate.ص-س",
           "sound.discriminate.ط-ت", "sound.discriminate.ق-ك", "sound.discriminate.ذ-ز-ظ",
           "sound.discriminate.ض-د"]
requires = ["letter.sound.م"]
