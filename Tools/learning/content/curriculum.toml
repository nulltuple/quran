[[lesson]]
id = "u2.l08"
unit = "U2"
title = "Sounds that are easy to mix up"
teaches = ["sound.discriminate.ح-ه", "sound.discriminate.ع-ء", "sound.discriminate.ص-س",
           "sound.discriminate.ط-ت", "sound.discriminate.ق-ك", "sound.discriminate.ذ-ز-ظ",
           "sound.discriminate.ض-د"]
requires = ["letter.sound.م"]

[[lesson]]
id = "u3.l01"
unit = "U3"
title = "Joining: the ba family"
teaches = ["orientation.joining", "letter.form.ب.initial", "letter.form.ب.medial", "letter.form.ب.final",
           "letter.form.ت.initial", "letter.form.ت.medial", "letter.form.ت.final", "letter.form.ث.initial",
           "letter.form.ث.medial", "letter.form.ث.final"]
