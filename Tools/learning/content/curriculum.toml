# Arabican curriculum (milestones L1, L3, L4 and L5): units U1-U9. Each lesson lists the skills it teaches
# and the skills a learner must have before starting it. Skill ids are generated by the compiler
# from letters.toml (see Tools/learning/compile.py, `generated_skills`):
#   letter.recognize.<letter>, letter.sound.<letter>, letter.form.<letter>.<form>,
#   letter.inword.<letter> (find it in a Quran word), letter.write.<letter> (trace it),
#   sound.discriminate.<a>-<b>[-<c>], orientation.<topic>,
#   vowel.listen.<vowel> (hear a syllable, pick it), vowel.read.<vowel> (see it, pick its sound),
#   mark.spot.<feature> (which letter of a Quran word has it), decode.words.<stage> (sound out
#   the start of Quran words: short, long, marks, full), and check.<unit> (see below).
# Every generated letter, sound, vowel, mark and decode skill must be taught by some lesson
# (validate_coverage).
#
# A unit with `check = true` gets a compiler-made check lesson (u<N>.check) after its last lesson:
# it teaches check.<unit> and requires every skill the unit teaches except orientation and
# tracing. Check exercises use only words from [quran] check_suras, which no practice exercise
# shows (unseen items, spec 03 §5.2 L4), and never use transliteration. The placement check asks
# these check skills in unit order.
#
# L5 adds two compiler-made units. U8, the Quran bridge, gets one lesson per [[bridge]] sura, teaching
# bridge.listen.<sura> (hear a word of the recitation, pick it) and bridge.meaning.<sura> (a word in
# its ayah, pick its meaning). U9, vocabulary, teaches lemma.meaning.<lemma> for the [vocabulary]
# top lemmas (Tools/learning/content/lemmas.tsv, by Quran-wide count), per_lesson at a time. Every
# U8 and U9 lesson requires check.U7.
# Lessons are authored here by agents and need a qualified teacher's review before any public
# release (spec 03 §4).

[quran]
# Suras whose words become quran_word_ref rows, verified against the canonical text. Together they
# plainly write all 29 letters (validate_word_letters): 94 adds ظ, 97 adds ز.
suras = [1, 94, 97, 103, 108, 110, 111, 112, 113, 114]
# Suras whose words only check exercises use, so a learner meets them unseen. Disjoint from suras.
check_suras = [93, 95, 96, 98, 99, 100, 101, 102, 104, 105, 106, 107, 109]

# Quran bridge (U8): practice suras with bundled recitation (content/recitation.toml) and word
# timings. Lessons follow this order; titles are the suras' transliterated names.
[[bridge]]
sura = 1
title = "Al-Fatihah"

[[bridge]]
sura = 112
title = "Al-Ikhlas"

[[bridge]]
sura = 113
title = "Al-Falaq"

[[bridge]]
sura = 114
title = "An-Nas"

[[bridge]]
sura = 108
title = "Al-Kawthar"

[[bridge]]
sura = 103
title = "Al-Asr"

[[bridge]]
sura = 110
title = "An-Nasr"

[[bridge]]
sura = 111
title = "Al-Masad"

