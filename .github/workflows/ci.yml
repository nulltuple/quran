name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  Guardrails:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        fetch-depth: 0

    - name: Guardrail tests
      run: bash Tools/check-agent-guardrails.test.sh

    - name: Arabican content compiler tests
      run: python3 -I Tools/learning/compile.test.py

    - name: Check new commits against AGENTS.md
      env:
        BEFORE: ${{ github.event.before }}
        BASE_REF: ${{ github.base_ref }}
      run: |
        if [ -n "$BASE_REF" ]; then
          range="origin/$BASE_REF..HEAD"
        elif [ -n "$BEFORE" ] && [ "$BEFORE" != 0000000000000000000000000000000000000000 ]; then
          range="$BEFORE..HEAD"
        else
          echo "No base commit to compare against; skipping."
          exit 0
        fi
        Tools/check-agent-guardrails.sh --range "$range"

  Package:
    runs-on: xcode-27
    timeout-minutes: 45

    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

    - name: Setting up Xcode
      run: sudo xcode-select -s "/Applications/Xcode_27.2.app"

    - name: Restore Xcode build cache
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: .build/DerivedData/no-sync
        key: ${{ runner.os }}-xcode-27.2-${{ github.job }}-${{ hashFiles('Package.resolved', 'Package.swift') }}-${{ github.sha }}
        restore-keys: |
          ${{ runner.os }}-xcode-27.2-${{ github.job }}-${{ hashFiles('Package.resolved', 'Package.swift') }}-

    - name: Install xcbeautify
      run: brew install xcbeautify

    - name: Run tests
      run: make test-no-sync

    - uses: codecov/codecov-action@a99c28d3f0da835de33ff2feb2e15691c7b9641f # v7.0.0
      with:
        token: ${{ secrets.CODECOV_TOKEN }}

  PackageSync:
    runs-on: xcode-27
    timeout-minutes: 45

    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

    - name: Setting up Xcode
      run: sudo xcode-select -s "/Applications/Xcode_27.2.app"

    - name: Restore Xcode build cache
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: .build/DerivedData/sync
        key: ${{ runner.os }}-xcode-27.2-${{ github.job }}-${{ hashFiles('Package.resolved', 'Package.swift') }}-${{ github.sha }}
        restore-keys: |
          ${{ runner.os }}-xcode-27.2-${{ github.job }}-${{ hashFiles('Package.resolved', 'Package.swift') }}-

    - name: Install xcbeautify
      run: brew install xcbeautify

    - name: Run tests
      run: make test-sync

  ExampleApp:
    runs-on: xcode-27
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setting up Xcode
        run: sudo xcode-select -s "/Applications/Xcode_27.2.app"

      - name: Restore Xcode build cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .build/DerivedData/no-sync
          key: ${{ runner.os }}-xcode-27.2-${{ github.job }}-${{ hashFiles('Package.resolved', 'Package.swift', 'Example/QuranEngineApp.xcodeproj/project.pbxproj') }}-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-xcode-27.2-${{ github.job }}-${{ hashFiles('Package.resolved', 'Package.swift', 'Example/QuranEngineApp.xcodeproj/project.pbxproj') }}-

      - name: Install xcbeautify
        run: brew install xcbeautify
      
      - name: Build
        run: make build-example-no-sync

  ExampleAppSync:
    runs-on: xcode-27
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setting up Xcode
        run: sudo xcode-select -s "/Applications/Xcode_27.2.app"

      - name: Restore Xcode build cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .build/DerivedData/sync
          key: ${{ runner.os }}-xcode-27.2-${{ github.job }}-${{ hashFiles('Package.resolved', 'Package.swift', 'Example/QuranEngineApp.xcodeproj/project.pbxproj') }}-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-xcode-27.2-${{ github.job }}-${{ hashFiles('Package.resolved', 'Package.swift', 'Example/QuranEngineApp.xcodeproj/project.pbxproj') }}-

      - name: Install xcbeautify
        run: brew install xcbeautify
      
      - name: Build
        run: make build-example-sync

  SwiftFormat:
    runs-on: xcode-27
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setting up Xcode
        run: sudo xcode-select -s "/Applications/Xcode_27.2.app"
      
      - name: SwiftFormat
        run: make format-lint

  # Arabican (Arabic learning app): ArabicLearning/ package tests and the Apps/Arabican build.
  ArabicanPackage:
    runs-on: xcode-27
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setting up Xcode
        run: sudo xcode-select -s "/Applications/Xcode_27.2.app"

      - name: Install xcbeautify
        run: brew install xcbeautify

      - name: Run tests
        run: make test-arabican

  ArabicanApp:
    runs-on: xcode-27
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setting up Xcode
        run: sudo xcode-select -s "/Applications/Xcode_27.2.app"

      - name: Install xcbeautify
        run: brew install xcbeautify

      - name: Build
        run: make build-arabican
